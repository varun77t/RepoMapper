# Render Blueprint: the API.
#
# The frontend is not here -- it is a static bundle on Vercel. Only the part
# that needs a filesystem, a git binary and a database lives on Render.
#
# Neither is the database. Render allows one free Postgres per account and
# that slot is already taken, so the database is a free Supabase project
# (`repomap`, ap-southeast-1, same region as this service). DATABASE_URL is
# marked `sync: false`: it carries a password, so Render prompts for it once
# and stores it, rather than it living in this file.
#
# Apply from the Render dashboard: New > Blueprint, pick this repository.

services:
  - type: web
    name: repomap-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile COPYs `requirements.txt` and `app/`, both relative to
    # backend/, so the build context is backend/ and not the repository root.
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Supabase's *session* pooler on port 5432, not the transaction pooler
      # on 6543: SQLAlchemy holds a connection pool and psycopg prepares
      # statements, neither of which survives transaction-level pooling.
      #
      # Supabase hands out a bare `postgresql://` URL; app/config.py rewrites
      # it to name psycopg 3 explicitly. See Settings._use_psycopg3.
      - key: DATABASE_URL
        sync: false

      # The browser origin allowed to call this API. A value that does not
      # match the deployed frontend exactly -- scheme included -- fails as an
      # opaque CORS error with nothing in the server log.
      - key: CORS_ORIGINS
        value: https://repomap-varunhombalamath-gmailcoms-projects.vercel.app

      # A free instance has 512 MB. Parsing holds every file's syntax tree in
      # memory at once, so the repository-size ceiling comes down from the
      # local default of 5000 and one analysis runs at a time.
      - key: MAX_FILES
        value: "1200"
      - key: JOB_WORKERS
        value: "1"
